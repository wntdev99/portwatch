name: CI

on:
  push:
    branches: [main, devel]
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[cross]"

      - name: Byte-compile
        run: python -m compileall -q portwatch

      - name: Collect real listeners
        run: python -c "from portwatch.core import collect; rows = collect(); print(len(rows), 'rows'); [print(' ', r['port'], r['title'], r['kind']) for r in rows[:5]]"

      - name: Diagnose the socket source (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          python -m http.server 7896 --bind 127.0.0.1 &
          sleep 2
          echo "--- lsof -F pcn ---"
          lsof -nP -iTCP -sTCP:LISTEN -F pcn | head -20 || echo "(lsof -F failed: $?)"
          echo "--- lsof plain ---"
          lsof -nP -iTCP -sTCP:LISTEN | head -10 || echo "(lsof failed: $?)"
          echo "--- netstat ---"
          netstat -an -p tcp | grep LISTEN | head -10 || echo "(netstat gave nothing)"
          echo "--- lsof exit code and stderr ---"
          python -c "
          from portwatch.core.platform import run_full
          code, out, err = run_full(['lsof', '-nP', '-iTCP', '-sTCP:LISTEN'])
          print('exit', code, '| stdout lines', len(out.splitlines()), '| stderr:', err.strip()[:300])
          "
          echo "--- psutil ---"
          python -c "
          import psutil
          try:
              conns = psutil.net_connections(kind='inet')
              listen = [c for c in conns if c.status == psutil.CONN_LISTEN]
              print('psutil total:', len(conns), 'listen:', len(listen))
          except Exception as exc:
              print('psutil raised:', type(exc).__name__, exc)
          "
          echo "--- portwatch layers ---"
          python -c "
          from portwatch.core import platform as p
          print('psutil rows:', len(p._listeners_psutil()) if p.psutil else 'no psutil')
          print('lsof -F rows:', len(p._listeners_lsof()))
          print('lsof plain rows:', len(p._listeners_lsof_plain()))
          print('netstat rows:', len(p._listeners_netstat()))
          print('listeners():', len(p.listeners()))
          "

      - name: A listener we start is actually found
        shell: bash
        run: |
          python -m http.server 7897 --bind 127.0.0.1 &
          sleep 3

          # 먼저 서버가 실제로 떠 있는지 확인한다.
          curl -sf http://127.0.0.1:7897/ > /dev/null || { echo "the test server never came up"; exit 1; }
          echo "test server is up"

          # 그 다음 OS 자체가 이 소켓을 보여주는지 본다. 보여주지 않는 샌드박스라면
          # PortWatch 가 못 찾는 것은 PortWatch 의 잘못이 아니다.
          if python -c "
          import subprocess, sys
          from portwatch.core.platform import IS_WINDOWS, IS_MAC, run
          if IS_WINDOWS:
              out = run(['netstat', '-ano'])
          elif IS_MAC:
              out = run(['netstat', '-an', '-p', 'tcp'])
          else:
              out = run(['ss', '-ltn'])
          sys.exit(0 if '7897' in out else 1)
          "; then
            echo "the OS lists the socket — PortWatch must find it too"
            python -c "
          from portwatch.core import collect
          rows = collect()
          hit = [r for r in rows if r['port'] == 7897]
          print('rows:', len(rows), '| 7897 found:', bool(hit))
          assert hit, 'the OS lists this socket but PortWatch did not'
          row = hit[0]
          print('  title:', row['title'], '| kind:', row['kind'], '| pid:', row['pid'], '| can_kill:', row['can_kill'])
          assert row['kind'] == 'http', row
          if row['pid']:
              assert row['can_kill'], 'we own it, so it must be terminable'
          else:
              print('  (no process details — the port is listed without an owner)')
          "
          else
            echo "::warning::This runner hides local sockets from netstat/ss, so end-to-end detection cannot be checked here. Verify on a real machine."
            python -c "
          from portwatch.core import collect
          print('collect() returned', len(collect()), 'rows without crashing')
          "
          fi

      - name: Demo data renders
        env:
          PORTWATCH_DEMO: "1"
        run: python -c "from portwatch.core import collect; rows = collect(); assert len(rows) == 9, rows; print('demo ok')"

      - name: Web server answers
        shell: bash
        run: |
          python -m portwatch --web --port 7899 --no-browser &
          sleep 4
          TOKEN=$(curl -s http://127.0.0.1:7899/ | grep -o 'data-token="[^"]*"' | cut -d'"' -f2)
          test -n "$TOKEN"
          curl -sf -H "X-PortWatch-Token: $TOKEN" http://127.0.0.1:7899/api/state > /dev/null
          echo "authorised request ok"
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:7899/api/state)
          test "$code" = "403" && echo "unauthenticated request rejected"
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "X-PortWatch-Token: $TOKEN" -H "Origin: https://evil.example" http://127.0.0.1:7899/api/state)
          test "$code" = "403" && echo "cross-origin request rejected"

      - name: Lint
        run: |
          pip install ruff
          ruff check --select E9,F63,F7,F82 portwatch

  desktop-entry:
    name: desktop entry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y desktop-file-utils
      - run: desktop-file-validate data/portwatch.desktop
