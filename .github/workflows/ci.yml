name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Byte-compile and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile
        run: python3 -m py_compile portwatch

      - name: Lint
        run: |
          pipx install ruff
          ruff check --select E9,F63,F7,F82 portwatch

      - name: Validate desktop entry
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y desktop-file-utils
          desktop-file-validate data/portwatch.desktop
